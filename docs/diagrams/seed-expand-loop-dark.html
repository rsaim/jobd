<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>The loop that gets cheaper every run</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --paper: #23262f; --paper-2: #393e53; --ink: #f5f5f5; --muted: #bfc0c0; --soft: #8e98ac;
      --accent: #f08a59; --accent-tint: rgba(240,138,89,0.10); --link: #6a95d8;
      --sans: 'Geist', system-ui, sans-serif; --serif: 'Instrument Serif', serif;
      --mono: 'Geist Mono', ui-monospace, monospace;
    }
    body { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 3rem 2rem; background: var(--paper); color: var(--ink); font-family: var(--sans); }
    .frame { width: 100%; max-width: 1200px; }
    .eyebrow { margin-bottom: 0.5rem; color: var(--muted); font: 500 0.66rem var(--mono); letter-spacing: 0.18em; text-transform: uppercase; }
    h1 { margin-bottom: 1.5rem; color: var(--ink); font: 400 clamp(1.5rem, 2.4vw + 0.75rem, 2rem)/1.15 var(--serif); letter-spacing: -0.02em; }
    svg { display: block; width: 100%; min-width: 900px; }
    .ring { fill: none; stroke: var(--muted); stroke-width: 1.2; }
    .spoke { fill: none; stroke: var(--soft); stroke-width: 1; stroke-dasharray: 5 4; }
    .station { fill: var(--paper); stroke: var(--ink); stroke-width: 1; }
    .station.focal { fill: var(--accent-tint); stroke: var(--accent); stroke-width: 1.2; }
    .ext { fill: rgba(245,245,245,0.04); stroke: rgba(245,245,245,0.30); stroke-width: 1; }
    .hub { fill: var(--ink); }
    .node-name { fill: var(--ink); font: 600 12px var(--sans); text-anchor: middle; }
    .focal-name { fill: var(--accent); }
    .sublabel { fill: var(--soft); font: 400 8px var(--mono); text-anchor: middle; }
    .hub-name { fill: var(--paper); font: 600 16px var(--sans); text-anchor: middle; }
    .hub-sub { fill: var(--paper); opacity: 0.72; font: 400 8px var(--mono); text-anchor: middle; }
    .arrow-label { fill: var(--soft); font: 400 8px var(--mono); letter-spacing: 0.06em; text-anchor: middle; }
    .legend-title { fill: var(--muted); font: 400 8px var(--mono); letter-spacing: 0.14em; }
    .legend-item { fill: var(--soft); font: 400 8px var(--mono); letter-spacing: 0.06em; }
    .aside { fill: var(--ink); font: italic 400 14px var(--serif); }
    .aside-accent { fill: var(--accent); font: italic 400 14px var(--serif); }
    .decay-title { fill: var(--muted); font: 400 8px var(--mono); letter-spacing: 0.14em; }
    .decay-val { font: 600 12px var(--sans); text-anchor: middle; }
    .decay-pass { fill: var(--soft); font: 400 8px var(--mono); text-anchor: middle; }
    .decay-note { fill: var(--soft); font: 400 8px var(--mono); text-anchor: start; }
  </style>
</head>
<body>
  <main class="frame">
    <p class="eyebrow">jobd &middot; seed &amp; expand</p>
    <h1>The loop that gets cheaper every run</h1>

    <svg viewBox="0 0 1040 812" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="loop-dark-title loop-dark-desc">
      <title id="loop-dark-title">The loop that gets cheaper every run</title>
      <desc id="loop-dark-desc">Mail is pulled from Gmail into a five-station clockwise loop — search, fetch, classify, learn, and a sweep of the direct-mail residual — whose record lands in Postgres. Classify and learn distil model verdicts into one shared store of learned sender rules, so each pass sends fewer messages to the model than the pass before.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bfc0c0"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#f08a59"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#6a95d8"/></marker>
        <marker id="arrow-soft" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#8e98ac"/></marker>
      </defs>
      <rect width="1040" height="812" fill="#23262f"/>

      <!-- External source and sink, drawn first so ring arrows sit above paper. -->
      <path class="ring" d="M136 168 L136 108 Q136 100 144 100 L432 100" marker-end="url(#arrow-link)" stroke="#6a95d8"/>
      <rect x="256" y="78" width="56" height="14" rx="2" fill="#23262f"/>
      <text x="284" y="89" class="arrow-label" fill="#6a95d8">MAIL IN</text>

      <path class="ring" d="M660 600 L660 652 Q660 660 668 660 L888 660" marker-end="url(#arrow)"/>
      <rect x="764" y="640" width="72" height="14" rx="2" fill="#23262f"/>
      <text x="800" y="651" class="arrow-label">RECORD OUT</text>

      <!-- Solid clockwise ring: five arcs on the same r=240 station circle. -->
      <path class="ring" d="M600.000 113.726 A240 240 0 0 1 733.784 230.930" marker-end="url(#arrow)"/>
      <path class="ring" d="M755.932 296.000 A240 240 0 0 1 696.043 503.122" marker-end="url(#arrow)"/>
      <path class="ring" d="M594.940 568.000 A240 240 0 0 1 446.201 568.372" marker-end="url(#arrow)"/>
      <path class="ring" d="M344.774 504.000 A240 240 0 0 1 283.851 297.180" marker-end="url(#arrow)"/>
      <path class="ring" d="M305.673 232.000 A240 240 0 0 1 438.870 114.129" marker-end="url(#arrow)"/>

      <!-- Dashed write-backs: verdicts distilled into standing rules. -->
      <path class="spoke" d="M637.143 504.000 L560.630 396.882" marker-end="url(#arrow-soft)"/>
      <path class="spoke" d="M402.857 504.000 L479.370 396.882" marker-end="url(#arrow-soft)"/>

      <!-- Spoke labels sit beside the line with a visible 6px+ gap. -->
      <rect x="612" y="444" width="72" height="16" rx="4" fill="#23262f"/>
      <text x="648" y="456" class="arrow-label">TEACH&#183;SILENCE</text>
      <rect x="372" y="444" width="56" height="16" rx="4" fill="#23262f"/>
      <text x="400" y="456" class="arrow-label">PROMOTE</text>

      <!-- External: Gmail source. -->
      <rect class="ext" x="76" y="168" width="120" height="64" rx="6"/>
      <g transform="translate(124,180) scale(0.58)" fill="#bfc0c0"><path d="M24 5.457v13.909c0 .904-.732 1.636-1.636 1.636h-3.819V11.73L12 16.64l-6.545-4.91v9.273H1.636A1.636 1.636 0 0 1 0 19.366V5.457c0-2.023 2.309-3.178 3.927-1.964L5.455 4.64 12 9.548l6.545-4.91 1.528-1.145C21.69 2.28 24 3.434 24 5.457z"/></g>
      <text x="136" y="220" class="sublabel">Gmail API</text>

      <!-- External: Postgres sink. -->
      <rect class="ext" x="888" y="628" width="120" height="64" rx="6"/>
      <g transform="translate(936,640) scale(0.58)" fill="#bfc0c0"><path d="M23.5594 14.7228a.5269.5269 0 0 0-.0563-.1191c-.139-.2632-.4768-.3418-1.0074-.2321-1.6533.3411-2.2935.1312-2.5256-.0191 1.342-2.0482 2.445-4.522 3.0411-6.8297.2714-1.0507.7982-3.5237.1222-4.7316a1.5641 1.5641 0 0 0-.1509-.235C21.6931.9086 19.8007.0248 17.5099.0005c-1.4947-.0158-2.7705.3461-3.1161.4794a9.449 9.449 0 0 0-.5159-.0816 8.044 8.044 0 0 0-1.3114-.1278c-1.1822-.0184-2.2038.2642-3.0498.8406-.8573-.3211-4.7888-1.645-7.2219.0788C.9359 2.1526.3086 3.8733.4302 6.3043c.0409.818.5069 3.334 1.2423 5.7436.4598 1.5065.9387 2.7019 1.4334 3.582.553.9942 1.1259 1.5933 1.7143 1.7895.4474.1491 1.1327.1441 1.8581-.7279.8012-.9635 1.5903-1.8258 1.9446-2.2069.4351.2355.9064.3625 1.39.3772a.0569.0569 0 0 0 .0004.0041 11.0312 11.0312 0 0 0-.2472.3054c-.3389.4302-.4094.5197-1.5002.7443-.3102.064-1.1344.2339-1.1464.8115-.0025.1224.0329.2309.0919.3268.2269.4231.9216.6097 1.015.6331 1.3345.3335 2.5044.092 3.3714-.6787-.017 2.231.0775 4.4174.3454 5.0874.2212.5529.7618 1.9045 2.4692 1.9043.2505 0 .5263-.0291.8296-.0941 1.7819-.3821 2.5557-1.1696 2.855-2.9059.1503-.8707.4016-2.8753.5388-4.1012.0169-.0703.0357-.1207.057-.1362.0007-.0005.0697-.0471.4272.0307a.3673.3673 0 0 0 .0443.0068l.2539.0223.0149.001c.8468.0384 1.9114-.1426 2.5312-.4308.6438-.2988 1.8057-1.0323 1.5951-1.6698zM2.371 11.8765c-.7435-2.4358-1.1779-4.8851-1.2123-5.5719-.1086-2.1714.4171-3.6829 1.5623-4.4927 1.8367-1.2986 4.8398-.5408 6.108-.13-.0032.0032-.0066.0061-.0098.0094-2.0238 2.044-1.9758 5.536-1.9708 5.7495-.0002.0823.0066.1989.0162.3593.0348.5873.0996 1.6804-.0735 2.9184-.1609 1.1504.1937 2.2764.9728 3.0892.0806.0841.1648.1631.2518.2374-.3468.3714-1.1004 1.1926-1.9025 2.1576-.5677.6825-.9597.5517-1.0886.5087-.3919-.1307-.813-.5871-1.2381-1.3223-.4796-.839-.9635-2.0317-1.4155-3.5126zm6.0072 5.0871c-.1711-.0428-.3271-.1132-.4322-.1772.0889-.0394.2374-.0902.4833-.1409 1.2833-.2641 1.4815-.4506 1.9143-1.0002.0992-.126.2116-.2687.3673-.4426       <text x="948" y="680" class="sublabel">Postgres</text>

      <!-- Stations, clockwise from the top. Icons sit left, text right. -->
      <rect class="station" x="440" y="68" width="160" height="64" rx="6"/>
      <g transform="translate(456,88) scale(0.72)" fill="none" stroke="#f5f5f5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10a7 7 0 1 0 14 0a7 7 0 1 0 -14 0"/><path d="M21 21l-6 -6"/></g>
      <text x="536" y="96" class="node-name">Search</text><text x="536" y="116" class="sublabel">queries + learned</text>

      <rect class="station" x="668" y="232" width="160" height="64" rx="6"/>
      <g transform="translate(684,252) scale(0.72)" fill="none" stroke="#f5f5f5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2 -2h14a2 2 0 0 1 2 2v10a2 2 0 0 1 -2 2h-14a2 2 0 0 1 -2 -2l0 -10"/><path d="M3 7l9 6l9 -6"/></g>
      <text x="764" y="260" class="node-name">Fetch</text><text x="764" y="280" class="sublabel">only what surfaced</text>

      <rect class="station" x="580" y="504" width="160" height="64" rx="6"/>

      <rect class="station focal" x="300" y="504" width="160" height="64" rx="6"/>
      <g transform="translate(316,524) scale(0.72)" fill="none" stroke="#f08a59" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l8 4.5l0 9l-8 4.5l-8 -4.5l0 -9l8 -4.5"/><path d="M12 12l8 -4.5"/><path d="M12 12l0 9"/><path d="M12 12l-8 -4.5"/></g>
      <text x="396" y="532" class="node-name focal-name">Learn</text><text x="396" y="552" class="sublabel">senders &#8594; next search</text>

      <rect class="station" x="212" y="232" width="160" height="64" rx="6"/>
      <g transform="translate(228,252) scale(0.72)" fill="none" stroke="#f5f5f5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12h16"/><path d="M4 18h16"/><path d="M4 6h16"/></g>
      <text x="308" y="260" class="node-name">Sweep</text><text x="308" y="280" class="sublabel">direct-mail residual</text>

      <!-- The one shared-state hub. -->
      <rect class="hub" x="420" y="288" width="200" height="104" rx="8"/>
      <text x="520" y="336" class="hub-name">Learned rules</text>
      <text x="520" y="360" class="hub-sub">none written by hand</text>

      <!-- Editorial aside on the hub. -->
      <text x="1008" y="176" class="aside" text-anchor="end">nothing here was typed by a human</text>
      <path d="M840 184 Q 740 224 624 320" fill="none" stroke="rgba(245,245,245,0.40)" stroke-width="1" stroke-dasharray="4,3"/>
      <circle cx="624" cy="320" r="2" fill="#f5f5f5"/>

      <!-- Cost decay: the claim the loop exists to make. Bars share a
           common baseline at y=712 so height alone encodes the fall. -->
      <rect x="76" y="616" width="340" height="120" rx="6" fill="#393e53" stroke="rgba(245,245,245,0.12)" stroke-width="1"/>
      <text x="96" y="640" class="decay-title">MODEL CALLS PER PASS</text>

      <rect x="96" y="656" width="88" height="56" rx="2" fill="rgba(245,245,245,0.34)"/>
      <text x="140" y="690" class="decay-val" fill="#23262f">every one</text>
      <text x="140" y="728" class="decay-pass">PASS 1</text>

      <rect x="204" y="680" width="88" height="32" rx="2" fill="rgba(245,245,245,0.20)"/>
      <text x="248" y="702" class="decay-val" fill="#f5f5f5">fewer</text>
      <text x="248" y="728" class="decay-pass">PASS 2</text>

      <rect x="312" y="696" width="88" height="16" rx="2" fill="rgba(240,138,89,0.45)"/>
      <text x="356" y="708" class="decay-val" fill="#f5f5f5" font-size="8">fewer still</text>
      <text x="356" y="728" class="decay-pass">PASS 3</text>

      <text x="452" y="652" class="aside-accent">every pass asks the model less</text>
      <text x="452" y="680" class="decay-note">a learned sender never costs a second call;</text>
      <text x="452" y="696" class="decay-note">a silenced one never costs a first.</text>
      <text x="452" y="720" class="decay-note">asserted by evals/run.py --learning</text>

      <!-- Legend strip -->
      <line x1="32" y1="760" x2="1008" y2="760" stroke="rgba(245,245,245,0.10)" stroke-width="0.8"/>
      <text x="32" y="780" class="legend-title">LEGEND</text>
      <line x1="120" y1="776" x2="152" y2="776" stroke="#bfc0c0" stroke-width="1.2"/>
      <text x="160" y="780" class="legend-item">one pass, clockwise</text>
      <line x1="344" y1="776" x2="376" y2="776" stroke="#8e98ac" stroke-width="1" stroke-dasharray="5 4"/>
      <text x="384" y="780" class="legend-item">model verdicts distilled into standing rules</text>
      <line x1="744" y1="776" x2="776" y2="776" stroke="#6a95d8" stroke-width="1.2"/>
      <text x="784" y="780" class="legend-item">your mailbox, read-only</text>
    </svg>
  </main>
</body>
</html>
