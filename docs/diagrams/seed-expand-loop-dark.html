<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>The loop that gets cheaper every run</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --paper: #2d3142; --ink: #f5f5f5; --muted: #bfc0c0; --soft: #8e98ac;
      --accent: #f08a59; --accent-tint: rgba(240,138,89,0.10); --link: #6a95d8;
      --sans: 'Geist', system-ui, sans-serif; --serif: 'Instrument Serif', serif;
      --mono: 'Geist Mono', ui-monospace, monospace;
    }
    body { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 3rem 2rem; background: var(--paper); color: var(--ink); font-family: var(--sans); }
    .frame { width: 100%; max-width: 1200px; }
    .eyebrow { margin-bottom: 0.5rem; color: var(--muted); font: 500 0.66rem var(--mono); letter-spacing: 0.18em; text-transform: uppercase; }
    h1 { margin-bottom: 1.5rem; color: var(--ink); font: 400 clamp(1.5rem, 2.4vw + 0.75rem, 2rem)/1.15 var(--serif); letter-spacing: -0.02em; }
    svg { display: block; width: 100%; min-width: 900px; }
    .ring { fill: none; stroke: var(--muted); stroke-width: 1.2; }
    .spoke { fill: none; stroke: var(--soft); stroke-width: 1; stroke-dasharray: 5 4; }
    .station { fill: var(--paper); stroke: var(--ink); stroke-width: 1; }
    .station.focal { fill: var(--accent-tint); stroke: var(--accent); stroke-width: 1.2; }
    .hub { fill: var(--ink); }
    .node-name { fill: var(--ink); font: 600 12px var(--sans); text-anchor: middle; }
    .focal-name { fill: var(--accent); }
    .sublabel { fill: var(--soft); font: 400 8px var(--mono); text-anchor: middle; }
    .hub-name { fill: var(--paper); font: 600 16px var(--sans); text-anchor: middle; }
    .hub-sub { fill: var(--paper); opacity: 0.72; font: 400 8px var(--mono); text-anchor: middle; }
    .arrow-label { fill: var(--soft); font: 400 8px var(--mono); letter-spacing: 0.06em; text-anchor: middle; }
    .legend-title { fill: var(--muted); font: 400 8px var(--mono); letter-spacing: 0.14em; }
    .legend-item { fill: var(--soft); font: 400 8px var(--mono); letter-spacing: 0.06em; }
  </style>
</head>
<body>
  <main class="frame">
    <p class="eyebrow">jobd &middot; seed &amp; expand</p>
    <h1>The loop that gets cheaper every run</h1>

    <svg viewBox="0 0 1040 740" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="jobd-loop-dark-title jobd-loop-dark-desc">
      <title id="jobd-loop-dark-title">The loop that gets cheaper every run</title>
      <desc id="jobd-loop-dark-desc">Five stations flow clockwise: search, fetch, classify, learn, and a sweep of the direct-mail residual. Classify and learn write distilled sender rules into one central hub, so each pass of the loop costs less than the one before.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bfc0c0"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#f08a59"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#6a95d8"/></marker>
        <marker id="arrow-soft" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#8e98ac"/></marker>
      </defs>
      <rect width="1040" height="740" fill="#2d3142"/>

      <!-- Solid clockwise ring: five arcs on the same r=240 station circle. -->
      <path class="ring" d="M600.000 113.726 A240 240 0 0 1 733.784 230.930" marker-end="url(#arrow)"/>
      <path class="ring" d="M755.932 296.000 A240 240 0 0 1 696.043 503.122" marker-end="url(#arrow)"/>
      <path class="ring" d="M594.940 568.000 A240 240 0 0 1 446.201 568.372" marker-end="url(#arrow)"/>
      <path class="ring" d="M344.774 504.000 A240 240 0 0 1 283.851 297.180" marker-end="url(#arrow)"/>
      <path class="ring" d="M305.673 232.000 A240 240 0 0 1 438.870 114.129" marker-end="url(#arrow)"/>

      <!-- Dashed write-backs: verdicts distilled into standing rules. -->
      <path class="spoke" d="M637.143 504.000 L560.630 396.882" marker-end="url(#arrow-soft)"/>
      <path class="spoke" d="M402.857 504.000 L479.370 396.882" marker-end="url(#arrow-soft)"/>

      <!-- Spoke labels sit beside the line with a visible 6px+ gap. -->
      <rect x="612" y="444" width="72" height="16" rx="4" fill="#2d3142"/>
      <text x="648" y="456" class="arrow-label">TEACH&#183;SILENCE</text>
      <rect x="372" y="444" width="56" height="16" rx="4" fill="#2d3142"/>
      <text x="400" y="456" class="arrow-label">PROMOTE</text>

      <!-- Stations, clockwise from the top. -->
      <rect class="station" x="440" y="68" width="160" height="64" rx="6"/>
      <text x="520" y="96" class="node-name">Search</text><text x="520" y="116" class="sublabel">queries + learned senders</text>

      <rect class="station" x="668" y="232" width="160" height="64" rx="6"/>
      <text x="748" y="260" class="node-name">Fetch</text><text x="748" y="280" class="sublabel">only what search surfaced</text>

      <rect class="station" x="580" y="504" width="160" height="64" rx="6"/>
      <text x="660" y="532" class="node-name">Classify</text><text x="660" y="552" class="sublabel">rules first, model second</text>

      <rect class="station focal" x="300" y="504" width="160" height="64" rx="6"/>
      <text x="380" y="532" class="node-name focal-name">Learn</text><text x="380" y="552" class="sublabel">new senders &#8594; next search</text>

      <rect class="station" x="212" y="232" width="160" height="64" rx="6"/>
      <text x="292" y="260" class="node-name">Sweep</text><text x="292" y="280" class="sublabel">the direct-mail residual</text>

      <!-- The one shared-state hub. -->
      <rect class="hub" x="420" y="288" width="200" height="104" rx="8"/>
      <text x="520" y="336" class="hub-name">Learned rules</text>
      <text x="520" y="360" class="hub-sub">none written by hand</text>

      <!-- Legend strip -->
      <line x1="32" y1="672" x2="1008" y2="672" stroke="rgba(245,245,245,0.12)" stroke-width="0.8"/>
      <text x="32" y="692" class="legend-title">LEGEND</text>
      <line x1="120" y1="688" x2="152" y2="688" stroke="#bfc0c0" stroke-width="1.2"/>
      <text x="160" y="692" class="legend-item">one pass, clockwise</text>
      <line x1="344" y1="688" x2="376" y2="688" stroke="#8e98ac" stroke-width="1" stroke-dasharray="5 4"/>
      <text x="384" y="692" class="legend-item">model verdicts distilled into standing rules</text>
    </svg>
  </main>
</body>
</html>
