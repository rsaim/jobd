[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "jobd-ai"
version = "0.1.0"
description = "Local-first agentic personal CRM for a job search"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Saim" }]

# Every dependency arrives with the milestone that actually calls it.
#   click    M2, the CLI
#   psycopg  M3, the derived store. Plain SQL, no ORM — the PRD picks none, and
#            adding one here would decide that question by accident.
#   boto3    M4, write-through to the bucket M1 provisioned.
#   google-* M4, Gmail. BYO OAuth client per §7 — there is no shared client id
#            anywhere in this tree, and the wizard exists so there never is one.
#   keyring  M4, OS-side secret storage for OAuth tokens.
#   fastapi, uvicorn  M7, the dashboard. The client is a Vite/React app in
#            frontend/ that this serves as static files; FastAPI's own job is
#            the JSON API under /api. Filters are still URL query params (M7
#            gate 1) and every result set still comes from one SQL call (M7
#            gate 2), so there is no client-side app state to duplicate in
#            M9's MCP server later. Jinja2 and python-multipart were dropped
#            with the templates: nothing renders HTML here and nothing posts
#            a form — every write is a JSON body.
dependencies = [
    "click>=8.1",
    "psycopg[binary]>=3.2",
    # crt extra: the `aws login` credential provider refuses to run without
    # it (MissingDependencyException at first S3 call, not at import).
    "boto3>=1.35",
    "botocore[crt]",
    "google-api-python-client>=2.140",
    "google-auth-oauthlib>=1.2",
    "keyring>=25.0",
    "fastapi>=0.115",
    "uvicorn>=0.32",
    # v2: the seed-and-expand scrape pipeline is a LangGraph state machine
    # (src/jobd/scrape/graph.py) — cyclic expansion loop, resumable nodes,
    # streamed node events for the live dashboard.
    "langgraph>=1.2",
]

[project.optional-dependencies]
dev = ["ruff>=0.6", "mypy>=1.11"]
# M5. Cloud/local models routed through LiteLLM (adapters/llm/litellm_provider.py) —
# ollama, OpenRouter, or any other LiteLLM-supported backend. Lazy-imported so a
# default install never pays for it (see that module's docstring on why).
# tenacity: litellm's num_retries lazy-imports it only when a retry actually
# fires — every earlier local test happened to succeed on the first attempt,
# so this was silently unmet until a real sustained run hit real rate limits.
llm = ["litellm>=1.50", "tenacity>=8.0"]
# The classification eval harness (evals/) — DeepEval is Confident AI's
# open-source eval framework; `evals/run.py` builds its test cases and
# metrics on it. Its own dependency tree is heavy, hence an extra.
eval = ["deepeval>=3.0"]
# M6, automated LinkedIn sync (adapters/linkedin/voyager_source.py). An
# unofficial Voyager wrapper — cookie-authed, no official message API exists.
# Lazy-imported: a default install neither pays for it nor depends on it, and
# the browser push paths need none of it.
linkedin = ["linkedin-api>=2.3"]
# Cookie extraction for the sync above (tools/linkedin_login.py). A full
# browser, so it is its own extra — most sync users grab the cookie by hand
# once and never install this. After it: `playwright install chromium`.
linkedin-login = ["playwright>=1.40"]

[project.scripts]
jobd = "jobd.cli.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/jobd"]
# The dashboard client is built into src/jobd/web/static/ and served from
# there, so it has to travel with the wheel. It is gitignored (a derived
# artifact) but not build-excluded.
artifacts = ["src/jobd/web/static/**"]

[tool.ruff]
line-length = 88
src = ["src"]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ANN", "RUF"]
ignore = ["ANN401"]  # Any is legitimate in a few port signatures

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]

# These ship no type information. Narrow, per-module opt-outs rather than a
# global `ignore_missing_imports` — a blanket setting would also silence a
# genuine typo in one of *our* module names, which is the failure this check
# exists to catch.
[[tool.mypy.overrides]]
module = [
    "boto3.*",
    "botocore.*",
    "googleapiclient.*",
    "oauthlib.*",
    "google_auth_oauthlib.*",
    # Optional extra: absent from a default install, so mypy must not require
    # it to be present in order to check the module that imports it lazily.
    "litellm.*",
]
ignore_missing_imports = true

# google-auth ships `py.typed` but leaves most of `Credentials` unannotated, so
# strict mode rejects every call into it. Scoped to the one module that talks to
# it, rather than sprinkled as inline ignores across each call site — the reason
# is the same for all of them, so it belongs in one place.
[[tool.mypy.overrides]]
module = ["jobd.adapters.gmail.auth"]
disallow_untyped_calls = false
