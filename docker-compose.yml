# One command to a working dashboard:
#
#   docker compose up -d
#   docker compose exec app jobd migrate up
#   docker compose exec app jobd demo          # synthetic mailbox, no creds
#   open http://localhost:8100
#
# The demo needs no API keys, no Gmail and no S3. For a real mailbox, see
# AGENTS.md — the same containers take Gmail OAuth credentials and (only if
# you want model-based extraction) an OpenRouter key via the environment.

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: jobd
      POSTGRES_PASSWORD: jobd
      POSTGRES_DB: jobd
    # Published so the host CLI (the non-Docker local-dev path in AGENTS.md,
    # which expects localhost:5432) can reach the same database the app
    # container uses — one store, two entry points, no separate "host DB".
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobd"]
      interval: 2s
      timeout: 3s
      retries: 15

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://jobd:jobd@db:5432/jobd
      JOBD_LOCAL_STORE: /data/raw
      # Optional, for LLM extraction and the chat dock — the demo and the
      # rule-based pipeline never read it:
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      # Max dollars a paid run may spend (the CreditGuard ceiling). The
      # default keeps the dashboard's Sync button usable out of the box while
      # still hard-capping a runaway run at pocket change; raise it in .env
      # for a full backfill. The CLI's per-run --budget flag still overrides.
      JOBD_RUN_BUDGET: ${JOBD_RUN_BUDGET:-2.00}
      # Concurrent extraction calls for the dashboard's Sync classify leg.
      # The CLI default stays 1 (see --llm-workers); the container serves
      # the Sync button, where a first sync can inherit a mailbox-sized
      # backlog — 8 turns a multi-hour sequential drain into under an hour
      # against the OpenRouter paid tier.
      JOBD_LLM_WORKERS: ${JOBD_LLM_WORKERS:-8}
      # Second-opinion model for classify-time escalation and the review
      # sweep. Unset (the default), ambiguous verdicts pile up in the review
      # queue with nothing to drain them but a human — set it and the punts
      # get a stronger head inline, so triage stays at spot-check size.
      # Opt-in on purpose: it spends money the extractor was chosen to save.
      JOBD_JUDGE_MODEL: ${JOBD_JUDGE_MODEL:-}
      # The company-summary card and the chat dock stay off until this is set
      # (a 404, not an error — see api.py's chat_turn). It is separate from
      # JOBD_MODEL on purpose: the extractor runs over the whole mailbox and
      # is chosen for cost, while these are a handful of interactive calls
      # that want a stronger head. Whatever is set here is offered in the
      # picker alongside _CHAT_MODEL_CHOICES.
      JOBD_CHAT_MODEL: ${JOBD_CHAT_MODEL:-openrouter/google/gemini-3.7-flash}
      # Per-token price for the extractor, $/Mtok. LiteLLM's price table
      # predates some gateway models, so without these the dashboard cost and
      # the CreditGuard run budget both read $0 — and the budget is only a
      # real ceiling if these match the model actually in use.
      #
      # These track DEFAULT_MODEL (openrouter/openai/gpt-oss-20b). They are
      # NOT generic: the previous pair (0.10/0.40) was gemini-2.5-flash-lite's
      # rate and over-stated deepseek-v4-flash-0731's spend by ~1.5x. Update
      # both numbers whenever JOBD_MODEL or DEFAULT_MODEL changes.
      JOBD_PRICE_PER_MTOK_IN: "0.03"
      JOBD_PRICE_PER_MTOK_OUT: "0.13"
    volumes:
      - rawstore:/data
      # Gmail tokens and the OAuth client JSON live under /root/.jobd (the
      # container has no OS keyring, so TokenStore falls back to files).
      # Without this volume every recreate silently logs the mailbox out.
      - jobdhome:/root/.jobd
    ports:
      - "8100:8100"
      # OAuth consent callback for `just gmail-auth` — only listens during
      # the wizard, dead air otherwise.
      - "8765:8765"

volumes:
  pgdata:
  rawstore:
  jobdhome:
