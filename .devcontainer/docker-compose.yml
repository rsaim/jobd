services:
  app:
    image: mcr.microsoft.com/devcontainers/python:3.12
    volumes:
      - ..:/workspaces/jobd-ai:cached
    command: sleep infinity
    depends_on:
      db:
        condition: service_healthy

  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: jobd
      POSTGRES_PASSWORD: jobd
      POSTGRES_DB: jobd
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobd"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
